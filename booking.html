<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book Equipment — Krishi Sanjha</title><link rel="icon" href="assets/favicon.svg"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css"></head><body data-page="booking"><div id="site-header"></div><main class="container section"><div class="booking-layout"><div><span class="eyebrow">DEMO BOOKING</span><h1>Book Equipment</h1><div id="bookingSteps" class="progress"></div><form id="bookingForm" class="card form-card">
