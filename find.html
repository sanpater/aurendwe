<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find Equipment — Krishi Sanjha</title><link rel="icon" href="assets/favicon.svg"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css"><link rel="stylesheet" href="css/animations.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head><body data-page="find"><div id="site-header"></div><main class="container section"><div class="page-head"><div><span class="eyebrow">DEMO MARKETPLACE</span><h1>Find Farm Equipment</h1><p>Search machines near your village.</p></div></div>
<div class="search-row"><input id="searchInput" placeholder="Search tractor, rotavator, harvester..."><button id="voiceBtn" class="icon-btn" title="Voice search">🎙️</button></div>
<div class="filters"><select id="categoryFilter"><option value="">All categories</option></select><select id="locationFilter"><option value="">All locations</option></select><select id="priceFilter"><option value="">Any price</option><option value="1000">Under ₹1,000/hour</option><option value="1500">Under ₹1,500/hour</option></select><select id="ratingFilter"><option value="">Any rating</option><option value="4">4+ rating</option><option value="4.5">4.5+ rating</option></select><select id="sortFilter"><option value="nearest">Nearest</option><option value="cheap">Cheapest</option><option value="rating">Highest Rated</option><option value="popular">Most Popular</option></select></div>
<div class="check-row"><label><input type="checkbox" id="availableFilter"> Available Today</label><label><input type="checkbox" id="operatorFilter"> Operator</label><label><input type="checkbox" id="deliveryFilter"> Delivery</label><label><input type="checkbox" id="verifiedFilter"> Verified</label></div>
<div class="market-grid"><div><div id="equipmentGrid" class="equipment-grid"></div></div><div><div id="map" class="map"></div><p id="mapFallback" class="muted hidden">Map unavailable. Showing nearby equipment list instead.</p></div></div></main><div id="site-footer"></div><div id="toast"></div>
<script src="js/data.js"></script><script src="js/storage.js"></script><script src="js/utils.js"></script><script src="js/language.js"></script><script src="js/navigation.js"></script><script src="js/equipment.js"></script><script src="js/marketplace.js"></script><script src="js/map.js"></script><script src="js/voice-search.js"></script><script src="js/app.js"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script></body></html>
