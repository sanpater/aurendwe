<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>List Equipment — Krishi Sanjha</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css"></head><body data-page="list-equipment"><div id="site-header"></div><main class="container section"><span class="eyebrow">OWNER</span><h1>List Your Equipment</h1><form id="equipmentForm" class="card form-card"><div class="form-grid"><label>Equipment name<input required id="eqName"></label><label>Category<select id="eqCategory"></select></label><label>Brand<input id="eqBrand"></label><label>Model<input id="eqModel"></label><label>Year<input type="number" id="eqYear" value="2024"></label><label>Condition<select id="eqCondition"><option>Excellent</option><option>Good</option><option>Fair</option></select></label><label>Hourly price<input required type="number" id="eqHourly"></label><label>Daily price<input required type="number" id="eqDaily"></label><label>Village<input required id="eqVillage"></label><label>Block<input id="eqBlock"></label><label>District<input required id="eqDistrict" value="East Champaran"></label><label>State<input required id="eqState" value="Bihar"></label></div><div class="check-row"><label><input type="checkbox" id="eqOperator"> Operator available</label><label><input type="checkbox" id="eqDelivery"> Delivery available</label></div><label>Description<textarea id="eqDescription"></textarea></label><label>Photos<input type="file" id="eqPhotos" accept="image/*" multiple></label><button class="btn btn-primary">Add Equipment</button><button type="button" id="verifyEquipment" class="btn btn-secondary">Verify Equipment</button></form></main><div id="site-footer"></div><div id="toast"></div><script src="js/data.js"></script><script src="js/storage.js"></script><script src="js/utils.js"></script><script src="js/owner.js"></script><script src="js/auth.js"></script><script src="js/language.js"></script><script src="js/navigation.js"></script><script src="js/app.js"></script></body></html>
